<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" href="app/icons/logo-favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ППО Ремонтного управління — головна</title>
<meta name="description" content="Первинна профспілкова організація Ремонтного управління «Газотранспортна система України»: новини, профком, документи, як вступити.">
<script src="config.js"></script>
<style>
:root{--ink:#18212f;--muted:#5f6b7c;--line:#e2e6ec;--bg:#f6f7f9;--card:#fff;--ru:#1f7a46;--ru-soft:#e3f5e7;--oru:#1f5fbf;--oru-soft:#e2eefc;--accent:#1f5fbf;--warm:#fff7d1}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
/* hero */
.hero{background:linear-gradient(120deg,#16603a 0%,#1f7a46 38%,#1f5fbf 100%);color:#fff;padding:34px 0 30px}
.hero .hlogo{float:right;width:132px;height:132px;border-radius:50%;background:#fff;padding:6px;margin:0 0 10px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (max-width:820px){.hero .hlogo{width:84px;height:84px}}
.hero .kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:28px;line-height:1.25;margin:8px 0 8px;max-width:860px}
.hero p{margin:0;opacity:.92;max-width:760px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;font:inherit;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn.light{background:#fff;color:#16603a}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
.btn.sm{padding:6px 11px;font-size:13px;font-weight:600}
.btn.blue{background:var(--accent);color:#fff}
.btn.outline{background:#fff;color:var(--accent);border-color:var(--accent)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:-22px 0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 4px 14px rgba(20,30,50,.06)}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.ru{border-top:4px solid var(--ru)} .stat.oru{border-top:4px solid var(--oru)}
/* layout */
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:22px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:22px}
h2{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2 .tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:20px;padding:2px 10px}
/* news */
.news{border-top:1px solid var(--line);padding:14px 0}
.news:first-of-type{border-top:0;padding-top:0}
.news .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.news h3{margin:4px 0 6px;font-size:16.5px}
.news .txt{white-space:pre-line;color:#2b3546}
.news.pin{background:var(--warm);margin:0 -12px;padding:14px 12px;border-radius:10px;border-top:0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:12px;padding:1px 8px}
.chip.ru{background:var(--ru-soft);color:var(--ru)} .chip.oru{background:var(--oru-soft);color:var(--oru)} .chip.pin{background:#ffe9a8;color:#7a5a00}
.more{margin-top:8px}
/* people */
.ppl{display:grid;gap:10px}
.person{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--bg)}
.ava{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--ru)}
.person.oru .ava{background:var(--oru)}
.person b{display:block}
.person .r{font-size:13px;color:var(--muted)}
.agrp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.agrp:first-child{margin-top:0}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover}
/* steps */
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 48px;background:var(--bg);border-radius:10px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--ru);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
/* docs */
.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.doc .n{font-weight:500}
.doc .d{font-size:12px;color:var(--muted)}
.contacts div{padding:6px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}
.contacts small{display:block;color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0 28px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:20;max-width:90vw}
@media (max-width:820px){.grid{grid-template-columns:1fr}.hero h1{font-size:22px}.stats{margin-top:-16px}}

.topnav{background:#0f4a2c;color:#fff}
.topnav .brand img{width:30px;height:30px;border-radius:50%;background:#fff;padding:1px;vertical-align:middle;margin-right:8px}
.topnav .wrap{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.topnav a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:7px;font-size:14px;font-weight:600;opacity:.9}
.topnav a:hover,.topnav a.on{background:rgba(255,255,255,.14);opacity:1}
.topnav .brand{margin-right:auto;font-weight:700;letter-spacing:.02em}
</style>
</head>
<body>
<nav class="topnav"><div class="wrap"><a class="brand" href="index.html"><img src="app/icons/logo-128.png" alt="">ППО РУ</a><a class="on" href="index.html">Головна</a><a href="profkom.html">Профком</a><a href="oblik.html">Облік членів (вхід)</a></div></nav>
<div id="root"><div class="loading">Завантаження…</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):(s||'');
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3500)}
const initials=n=>String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const nameShort=n=>{const p=String(n||'').split(/\s+/);return p.length>=3?p[0][0]+p[0].slice(1).toLowerCase()+' '+p[1]+' '+p[2]:n};
let H=null,NEWS_LIMIT=5;
const telA=p=>p?`<a href="tel:${esc(p.replace(/[^\d+]/g,''))}">${esc(p)}</a>`:'';
function aktivHtml(a){
  return a.groups.map(g=>`<div class="agrp">${esc(g)}</div><div class="ppl">${a.items.filter(i=>i.group===g).map(p=>
    `<div class="person${/ОРУ/.test(g)?' oru':''}"><div class="ava">${p.photo?`<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer">`:esc(initials(p.name))}</div>
      <div><b>${esc(nameShort(p.name))}</b><div class="r">${esc(p.role)}${p.unit?'<br>'+esc(p.unit):''}</div>${telA(p.phone)}</div></div>`).join('')}</div>`).join('');
}

function render(){
  const s=H.stats;
  const leaders=H.profkom.filter(p=>p.organ!=='Ревізійна комісія'||/Голова/.test(p.role));
  const news=H.news.slice(0,NEWS_LIMIT);
  const applyTpl=H.templates.find(t=>/заяв/i.test(t.name)&&/вступ/i.test(t.name));
  $('#root').innerHTML=`
  <div class="hero"><div class="wrap">
    <img class="hlogo" src="app/icons/logo-256.png" alt="Логотип профспілки">
    <div class="kicker">Профспілка — це ми</div>
    <h1>${esc(H.org)}</h1>
    <p>${esc(H.sub||'Захищаємо трудові права, дбаємо про безпечні умови праці, соціальні гарантії та підтримку працівників і їхніх родин.')}</p>
    <div class="actions">
      <a class="btn light" href="#join">Як вступити до профспілки</a>
      <a class="btn ghost" href="#docs">Документи</a>
      <a class="btn ghost" href="#contacts">Контакти</a>
      <a class="btn ghost" href="oblik.html">Увійти до обліку →</a>
    </div></div></div>
  <div class="wrap">
    <div class="stats">
      <div class="stat ru"><b>${s.ru}</b><span>членів профспілки РУ</span></div>
      ${s.oru?`<div class="stat oru"><b>${s.oru}</b><span>членів профспілки ${esc(H.oruName||'ОРУ')}</span></div>`:''}
      <div class="stat"><b>${s.pct}%</b><span>працівників — члени профспілки</span></div>
      <div class="stat"><b>${s.staff}</b><span>працівників підприємства</span></div>
    </div>
    <div class="grid">
      <div>
        <section id="news"><h2>Новини та оголошення ${H.news.length?`<span class="tag">${H.news.length}</span>`:''}</h2>
          ${news.map(n=>`<article class="news${n['Закріплено']==='Так'?' pin':''}">
            <div class="meta">${n['Закріплено']==='Так'?'<span class="chip pin">Важливо</span>':''}<span>${esc(dmy(n['Дата']))}</span>
              ${n['Профспілка']==='РУ'?'<span class="chip ru">РУ</span>':n['Профспілка']==='ОРУ'?'<span class="chip oru">ОРУ</span>':''}</div>
            <h3>${esc(n['Заголовок'])}</h3>${n['Текст']?`<div class="txt">${linkify(n['Текст'])}</div>`:''}
            ${n['Посилання']?`<div class="more"><a href="${esc(n['Посилання'])}" target="_blank" rel="noopener">Детальніше →</a></div>`:''}</article>`).join('')
          ||'<p class="empty">Новин поки немає.</p>'}
          ${H.news.length>NEWS_LIMIT?`<button class="btn outline sm" id="moreNews">Показати ще (${H.news.length-NEWS_LIMIT})</button>`:''}
        </section>
        <section id="join"><h2>Як вступити до профспілки</h2>
          ${H.howTo?`<div style="white-space:pre-line;margin-bottom:12px">${linkify(H.howTo)}</div>`:''}
          <ol class="steps">
            <li>Заповніть <b>заяву про вступ</b> до первинної профспілкової організації${applyTpl?` — <a href="#" data-dl="${esc(applyTpl.id)}" data-fmt="docx">скачати бланк</a>`:''}.</li>
            <li>Напишіть заяву про <b>згоду на утримання членських внесків</b> із заробітної плати (розмір визначено статутом).</li>
            <li>Передайте заяви голові або члену профкому свого підрозділу.</li>
            <li>Профком розгляне заяву на найближчому засіданні та видасть <b>профспілковий квиток</b>.</li>
          </ol></section>
      </div>
      <div>
        <section id="leaders"><h2>Профспілковий комітет</h2>
          ${H.aktiv?aktivHtml(H.aktiv):`<div class="ppl">${leaders.map(p=>`<div class="person ${p.union==='ОРУ'?'oru':''}"><div class="ava">${esc(initials(p.name))}</div>
            <div><b>${esc(nameShort(p.name))}</b><div class="r">${esc(p.role)}${p.union?' · '+esc(p.union):''}${p.dir?'<br>'+esc(p.dir):''}</div>
            ${p.phone?`<a href="tel:${esc(p.phone.replace(/[^\d+]/g,''))}">${esc(p.phone)}</a>`:''}</div></div>`).join('')||'<p class="empty">Склад профкому буде опубліковано найближчим часом.</p>'}</div>`}</section>
        <section id="contacts"><h2>Контакти</h2><div class="contacts">
          ${H.phone?`<div><small>Телефон</small><a href="tel:${esc(H.phone.replace(/[^\d+]/g,''))}">${esc(H.phone)}</a></div>`:''}
          ${H.email?`<div><small>Email</small><a href="mailto:${esc(H.email)}">${esc(H.email)}</a></div>`:''}
          ${H.address?`<div><small>Адреса</small>${esc(H.address)}</div>`:''}
          ${H.hours?`<div><small>Прийом</small>${esc(H.hours)}</div>`:''}
          ${!H.phone&&!H.email&&!H.address&&!H.hours?'<p class="empty">Контакти буде додано найближчим часом.</p>':''}</div></section>
        <section id="docs"><h2>Документи</h2>
          <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px">Установчі документи</div>
          ${H.docs.map(d=>`<div class="doc"><div><div class="n">${esc(d.name)}</div><div class="d">оновлено ${esc(d.updated)}</div></div><button class="btn outline sm" data-dl="${esc(d.id)}">Скачати</button></div>`).join('')||'<p class="empty">—</p>'}
          <div style="font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 4px">Зразки заяв і документів</div>
          ${H.templates.map(d=>`<div class="doc"><div><div class="n">${esc(d.name)}</div><div class="d">оновлено ${esc(d.updated)}</div></div><button class="btn outline sm" data-dl="${esc(d.id)}" data-fmt="docx">Скачати</button></div>`).join('')||'<p class="empty">—</p>'}
        </section>
      </div>
    </div>
  </div>
  <footer class="wrap">© ${new Date().getFullYear()} ${esc(H.org)}</footer>`;
  if($('#moreNews'))$('#moreNews').onclick=()=>{NEWS_LIMIT+=10;render();location.hash='news'};
}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-dl]');if(!b)return;e.preventDefault();
  if(b.dataset.busy)return;b.dataset.busy=1;const old=b.textContent;b.textContent='Завантаження…';
  api({api:'dl',id:b.dataset.dl,fmt:b.dataset.fmt||''}).then(f=>{b.textContent=old;delete b.dataset.busy;
      const bin=atob(f.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:f.mime}));a.download=f.name;document.body.appendChild(a);a.click();a.remove()})
    .catch(er=>{b.textContent=old;delete b.dataset.busy;toast('Помилка: '+er.message)})});

/* дані з Apps Script (див. config.js) */
function api(params){const u=new URL(window.PPO_API);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  return fetch(u.toString()).then(r=>r.json()).then(j=>{if(j&&j.error)throw new Error(j.error);return j})}
api({api:'home'}).then(h=>{H=h;render()}).catch(e=>{$('#root').innerHTML='<div class="loading">Не вдалося завантажити дані: '+esc(e.message)+'</div>'});
</script>
</body>
</html>
